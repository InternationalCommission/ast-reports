<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Request Approvals</title><link rel="icon" href="https://internationalcommission.org/Files/Blue-globe-square-crop.png.webp"><script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.27.0/lib/msal-browser.min.js"></script><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Source+Serif+4:wght@300;400;600&display=swap" rel="stylesheet"><style>
:root{--navy:#1a3a5c;--gold:#c8a96e;--paper:#f2ede6;--cream:#f9f7f4;--ink:#1a1a1a;--muted:#6b6660;--border:#d8d0c6;--green:#2a6b3c;--red:#9b2335}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px 'Source Serif 4',Georgia,serif}.top{background:var(--navy);color:white;padding:22px 5%;display:flex;justify-content:space-between;align-items:center;gap:15px}.top h1{font:700 26px 'Playfair Display',serif;margin:0}.btn{background:var(--navy);color:white;border:0;padding:10px 16px;border-radius:4px;cursor:pointer;font:inherit}.btn.light{background:#ffffff20;border:1px solid #ffffff55}.btn.ok{background:var(--green)}.btn.no{background:var(--red)}main{max-width:1200px;margin:26px auto;padding:0 18px}.auth,.detail,.list{background:var(--cream);border:1px solid var(--border);border-radius:6px;padding:22px;margin-bottom:18px}.muted{color:var(--muted)}.requests{display:grid;gap:12px}.request{background:white;border:1px solid var(--border);border-radius:5px;padding:16px;display:grid;grid-template-columns:1fr auto;gap:12px}.request h3{margin:0 0 5px;color:var(--navy)}.pill{display:inline-block;border-radius:99px;background:#eee5d5;padding:3px 10px;font-size:13px;margin-right:6px}.request button{align-self:center}.hidden{display:none}.detail h2{color:var(--navy)}.detail dl{display:grid;grid-template-columns:220px 1fr;gap:8px 15px}.detail dt{font-weight:600}.detail dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}.decision{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.decision textarea{width:100%;min-height:75px;padding:10px;font:inherit;border:1px solid var(--border)}.error{color:var(--red)}@media(max-width:650px){.request{grid-template-columns:1fr}.detail dl{grid-template-columns:1fr;gap:2px}.detail dd{margin-bottom:10px}}
</style></head><body><header class="top"><h1>Project Request Approvals</h1><button class="btn light" id="signOut" hidden>Sign out</button></header><main>
<section class="auth" id="authPanel"><h2>AST Area VP approval dashboard</h2><p class="muted">Sign in with your International Commission Microsoft 365 account. VPs see requests assigned to their mapped area; authorized administrators can review all requests.</p><button class="btn" id="signIn">Sign in with Microsoft</button><p id="authError" class="error"></p></section>
<section class="list hidden" id="listPanel"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div><h2>Incoming requests</h2><p id="summary" class="muted"></p></div><button class="btn" id="refresh">Refresh</button></div><div id="requests" class="requests"></div></section>
<section class="detail hidden" id="detailPanel"><button class="btn" id="back">← Back to requests</button><div id="detailContent"></div></section>
</main><script>
const WORKER_URL="https://ast-report.alex-wascomb.workers.dev",TENANT_ID="3e34eb62-b83a-4aa8-8ba8-d0959d15e612",ADMIN_CLIENT_ID="66d5787b-f69b-468a-af0b-6791dee76928",API_SCOPE="api://"+ADMIN_CLIENT_ID+"/Reports.Read";
const msalInstance=new msal.PublicClientApplication({auth:{clientId:ADMIN_CLIENT_ID,authority:"https://login.microsoftonline.com/"+TENANT_ID,redirectUri:window.location.origin+window.location.pathname},cache:{cacheLocation:"sessionStorage",storeAuthStateInCookie:false}});
let account=null,token=null,items=[],selected=null;
const $=id=>document.getElementById(id);
const escapeHtml=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function getToken(){const a=msalInstance.getAllAccounts()[0];if(!a)throw Error("Please sign in.");account=a;try{const r=await msalInstance.acquireTokenSilent({account:a,scopes:[API_SCOPE]});token=r.accessToken}catch{const r=await msalInstance.acquireTokenPopup({account:a,scopes:[API_SCOPE]});token=r.accessToken}return token}
async function api(path,options={}){const t=await getToken();const r=await fetch(WORKER_URL+path,{...options,headers:{Authorization:"Bearer "+t,"Content-Type":"application/json",...(options.headers||{})}});const data=await r.json();if(!r.ok)throw Error(data.error||"Request failed");return data}
function showError(e){$("authError").textContent=e.message||String(e)}
async function load(){try{const data=await api("/project-requests");items=data.items||[];$("summary").textContent=items.length+" request(s) · select a request to review";$("requests").innerHTML=items.length?items.map((x,i)=>'<article class="request"><div><h3>'+escapeHtml(x.requestTitle||x.title||"Project request")+'</h3><span class="pill">'+escapeHtml(x.projectType||"Unknown type")+'</span><span class="pill">'+escapeHtml(x.status||"Pending")+'</span><p class="muted">'+escapeHtml(x.country||"")+' · '+escapeHtml(x.area||"")+' · Submitted '+escapeHtml(x.createdAt||"")+'</p></div><button class="btn" data-index="'+i+'">Review</button></article>').join(""):'<p>No project requests found.</p>';$("requests").querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>showDetail(items[Number(b.dataset.index)])))}catch(e){showError(e)}}
function showDetail(item){selected=item;$("listPanel").classList.add("hidden");$("detailPanel").classList.remove("hidden");const omit=new Set(["id","createdAt","modifiedAt","@odata.etag"]);const labels={projectType:"Project type",country:"Country",area:"Project area",startDate:"Starting date",endDate:"Finishing date",completedDate:"Date completed",nationalProjectType:"National project type",theme:"Project theme / motto",churches:"Participating churches",hearers:"Expected Gospel hearers",decisions:"Expected decisions for Christ",discipled:"Expected people discipled",baptisms:"Expected baptisms",leader1Name:"Main leader",leader1Address:"Main leader address",leader1Phone:"Main leader telephone",leader1Email:"Main leader email",leader2Name:"Second leader",leader2Address:"Second leader address",leader2Phone:"Second leader telephone",leader2Email:"Second leader email",firstTime:"First-time IC project",spiritualNeeds:"Spiritual needs",importance:"Area importance",vision:"Project vision / goals",coordinator:"Area coordinator",astVpName:"AST Area VP",status:"Status",reviewNotes:"Review notes"};const rows=Object.entries(item).filter(([k,v])=>!omit.has(k)&&v!==null&&v!==undefined&&v!=="").map(([k,v])=>'<dt>'+escapeHtml(labels[k]||k.replace(/([A-Z])/g," $1"))+'</dt><dd>'+escapeHtml(typeof v==="object"?JSON.stringify(v):v)+'</dd>').join("");$("detailContent").innerHTML='<h2>'+escapeHtml(item.requestTitle||"Project request")+'</h2><dl>'+rows+'</dl><div class="decision"><label style="width:100%">Notes for submitter / decision notes<textarea id="reviewNotes" placeholder="Optional comments"></textarea></label><button class="btn ok" id="approve">Approve request</button><button class="btn no" id="reject">Reject request</button></div><p class="muted">Approval records the signed-in reviewer, date, and notes.</p>';$("reviewNotes").value=item.reviewNotes||"";$("approve").addEventListener("click",()=>decide("Approved"));$("reject").addEventListener("click",()=>decide("Rejected"))}
async function decide(status){try{await api("/project-requests/"+encodeURIComponent(selected.id),{method:"PATCH",body:JSON.stringify({status,reviewNotes:$("reviewNotes").value})});$("detailContent").insertAdjacentHTML("beforeend",'<p>Decision saved.</p>');await load();$("detailPanel").classList.add("hidden");$("listPanel").classList.remove("hidden")}catch(e){showError(e)}}
$("signIn").addEventListener("click",async()=>{try{await msalInstance.loginPopup({scopes:["openid","profile",API_SCOPE]});await start()}catch(e){showError(e)}});$("refresh").addEventListener("click",load);$("back").addEventListener("click",()=>{$("detailPanel").classList.add("hidden");$("listPanel").classList.remove("hidden")});$("signOut").addEventListener("click",()=>msalInstance.logoutPopup({account}));
async function start(){try{await msalInstance.initialize();await msalInstance.handleRedirectPromise();account=msalInstance.getAllAccounts()[0];if(!account)return;$("authPanel").classList.add("hidden");$("listPanel").classList.remove("hidden");$("signOut").hidden=false;await load()}catch(e){showError(e)}}
msalInstance.initialize().then(()=>msalInstance.handleRedirectPromise()).then(r=>{if(r?.account)account=r.account;if(msalInstance.getAllAccounts().length)start()}).catch(showError);
</script></body></html>
